<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nietzsche 8-bit</title><style>html,body{margin:0;background:#08070c;color:#eee3d2;font-family:monospace}body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;box-sizing:border-box}#wrap{width:min(1120px,100%);text-align:center}h1{margin:0 0 8px;color:#e0ba65;text-shadow:3px 3px #321827;font-size:clamp(18px,3vw,28px)}canvas{width:100%;display:block;border:6px solid #65495a;box-shadow:0 0 0 3px #17101a,0 18px 50px #000;image-rendering:pixelated}#help{font-size:12px;color:#aa9a9e;margin-top:8px}button{font:inherit;background:#302034;color:#f4e6cf;border:2px solid #8c6879;padding:7px 12px;margin-top:8px}</style></head><body><div id="wrap"><h1>NIETZSCHE — A FILOSOFIA COM O MARTELO</h1><canvas id="game" width="960" height="540"></canvas><div id="help">← → / A D: caminhar · ENTER/ESPAÇO: interagir · 1–4: responder · letras na forca · M: som</div><button id="sound">🔊 Som ligado</button></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const W=960,H=540;
let state='title',stage=0,lives=3,px=120,cam=0,selected=-1,toast='',toastTime=0,hangErrors=0,guessed=new Set();
const qs=[
{title:'FILOSOFAR COM O MARTELO',q:'O que significa, em Nietzsche, “filosofar com o martelo”?',o:['Destruir tudo pela força física.','Examinar e questionar criticamente valores e ídolos tidos como absolutos.','Provar que a ciência é sempre falsa.','Defender uma moral universal e imutável.'],a:1},
{title:'A MORTE DE DEUS',q:'No sentido filosófico da expressão, o que anuncia a “morte de Deus”?',o:['Apenas uma previsão sobre religião.','A descoberta científica de um novo planeta.','A crise dos fundamentos absolutos que davam sentido e valor à cultura ocidental.','Que Nietzsche propunha simplesmente trocar Deus por outro deus.'],a:2},
{title:'CONTRA O CIENTIFICISMO',hang:true},
{title:'PERSPECTIVISMO',q:'O perspectivismo de Nietzsche implica que…',o:['Existe uma visão neutra, definitiva e sem perspectiva.','Toda opinião vale exatamente o mesmo, sem qualquer critério.','O conhecimento é situado em perspectivas; interpretar não é acessar um ponto de vista absolutamente neutro.','A verdade deixa de ter qualquer relação com interpretação.'],a:2}];
const word='CIENTIFICISMO';let mask=['C','I','_','N','T','I','F','I','C','I','S','M','O'];
let audio=null,music=true,musicTimer=null,musicStep=0;
function audioInit(){if(!music)return;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!musicTimer)musicTimer=setInterval(song,240)}
function beep(f,d=.1,type='square',v=.03){if(!music)return;audioInit();if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start(t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d)}
function song(){if(!['title','walk','win','lose'].includes(state))return;let n=[110,0,147,0,165,0,147,0][musicStep++%8];if(n)beep(n,.15,'triangle',.015)}
document.getElementById('sound').onclick=()=>{music=!music;document.getElementById('sound').textContent=music?'🔊 Som ligado':'🔇 Som desligado';if(music)audioInit()};
function R(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x|0,y|0,w,h)}function T(s,x,y,z=17,col='#eee3d2',a='left'){ctx.font=`bold ${z}px monospace`;ctx.fillStyle=col;ctx.textAlign=a;ctx.fillText(s,x,y)}
function wrap(s,x,y,max,z=17,lh=25,col='#eee3d2'){ctx.font=`bold ${z}px monospace`;let line='',yy=y;for(let w of s.split(' ')){let t=line?line+' '+w:w;if(ctx.measureText(t).width>max){T(line,x,yy,z,col);yy+=lh;line=w}else line=t}if(line)T(line,x,yy,z,col);return yy}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080711');g.addColorStop(.6,'#1a1120');g.addColorStop(1,'#08070b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);R(735,52,70,70,'#d8c99f');R(715,70,20,35,'#d8c99f');R(805,70,14,30,'#d8c99f');for(let i=-1;i<8;i++){let x=i*180-(cam*.18%180);ctx.fillStyle='#20152a';ctx.beginPath();ctx.moveTo(x,350);ctx.lineTo(x+90,185+(i%2)*25);ctx.lineTo(x+180,350);ctx.fill()}R(0,330,W,130,'#110c17');for(let i=-1;i<12;i++){let x=i*105-(cam*.35%105);R(x,245,78,215,'#17101c');R(x+8,225,62,20,'#241726')}for(let x of [80,290,500,710,920]){R(x,175,76,285,'#140d19');for(let k=0;k<4;k++)R(x+10+k*17,154,10,22,'#140d19')}for(let i=0;i<20;i++){let x=(i*61-cam*.45)%1000;if(x<0)x+=1000;R(x,310+(i%4)*29,9,16,'#c99345')}R(0,460,W,80,'#09070c');for(let i=0;i<40;i++){let x=(i*33-cam*.8)%W;if(x<0)x+=W;R(x,485+(i%2)*13,16,4,'#4a3144')}}
function hero(){let sx=px-cam,sy=415,walk=(Date.now()/130|0)%2;R(sx-21,432,42,5,'#050409');R(sx-15,sy-55,30,46,'#3c213e');R(sx-20,sy-17,40,14,'#251625');R(sx-7,sy-82,25,26,'#c58a69');R(sx-12,sy-87,35,10,'#4a2828');R(sx-15,sy-69,17,8,'#120d12');R(sx+10,sy-69,17,8,'#120d12');R(sx-4,sy-65,14,6,'#120d12');R(sx+1,sy-76,4,4,'#171014');R(sx+13,sy-76,4,4,'#171014');R(sx-25,sy-45,10,29,'#c58a69');R(sx+18,sy-45,10,29,'#c58a69');if(walk===0){R(sx-11,sy-5,11,22,'#181018');R(sx+10,sy-1,11,18,'#181018')}else{R(sx-11,sy-1,11,18,'#181018');R(sx+10,sy-5,11,22,'#181018')}R(sx-17,sy+14,18,7,'#08070b');R(sx+7,sy+14,18,7,'#08070b')}
function hud(){R(18,15,925,48,'#0c0910');R(23,20,915,38,'#211522');T('NIETZSCHE',38,45,17,'#d8b66a');T('VIDAS',205,45,15,'#c6b4a4');for(let i=0;i<3;i++)T(i<lives?'♥':'♡',255+i*27,47,21,i<lives?'#dc626a':'#5e4652');T(`DESAFIO ${Math.min(stage+1,4)}/4`,790,45,15,'#c6b4a4','right')}
function gate(){let sx=1820-cam;R(sx-38,300,76,160,'#241624');R(sx-24,325,48,135,'#0a0810');T('?',sx,377,30,'#d8b66a','center')}
function world(){bg();gate();hero();hud();if(px>1710){R(585,392,330,54,'#0b0810');R(591,398,318,42,'#382238');T('ENTER / ESPAÇO — enfrentar o desafio',750,425,14,'#f0d9a6','center')}if(toastTime>0){R(270,90,420,52,'#100b14');T(toast,480,123,18,'#f0c86b','center');toastTime--}}
function panel(){R(48,78,864,375,'#08070c');R(56,86,848,359,'#241727');R(68,98,824,335,'#0f0b14')}
function question(){panel();let q=qs[stage];T(q.title,90,137,23,'#dfb963');wrap(q.q,90,172,760,17,25);q.o.forEach((o,i)=>{let y=235+i*43;R(92,y-24,776,34,selected===i?'#56344e':'#211623');T(`${i+1}) ${o}`,108,y,15,selected===i?'#ffe7aa':'#e7dbcc')});T('Escolha uma alternativa com 1–4.',480,424,13,'#9f8c9a','center');if(toastTime>0)T(toast,480,395,16,toast.startsWith('COR')?'#8fe0a2':'#e16c76','center')}
function hang(){panel();T('CONTRA O CIENTIFICISMO',480,130,23,'#dfb963','center');wrap('Complete a palavra ligada à crítica de Nietzsche à ideia de que a ciência possa explicar e esgotar toda a realidade.',480,165,720,16,24);T('PISTA: crença de que a ciência é a explicação definitiva de tudo.',480,232,13,'#c4b3b8','center');T('A palavra começa com C e tem 13 letras.',480,255,13,'#c4b3b8','center');T(mask.join(' '),480,313,25,'#f0c86b','center');T(`Erros: ${hangErrors}/3`,480,352,13,hangErrors?'#dc7079':'#9f8c9a','center');T(`Letras tentadas: ${[...guessed].join(', ')||'nenhuma'}`,480,375,12,'#a99aa1','center');T('Digite letras. Quando completar, pressione ENTER.',480,414,12,'#b9a9b1','center')}
function overlay(title,body,sub){bg();hero();R(80,80,800,365,'#07060b');R(88,88,784,349,'#2a1b2b');R(102,102,756,321,'#100c15');T(title,480,165,30,'#e0ba65','center');wrap(body,145,220,670,18,28);T(sub,480,390,14,'#c4b3b8','center')}
function draw(){if(state==='title')overlay('NIETZSCHE 8-BIT','Atravesse o castelo, encontre os quatro desafios filosóficos e chegue à saída. Você começa com 3 vidas.','ENTER, ESPAÇO ou clique para começar');else if(state==='walk')world();else if(state==='question'){bg();question()}else if(state==='hang'){bg();hang()}else if(state==='win')overlay('VOCÊ CHEGOU AO FIM','Nietzsche atravessou o castelo e respondeu aos quatro desafios.','ENTER ou ESPAÇO: voltar obrigatoriamente ao começo');else if(state==='lose')overlay('GAME OVER','As três vidas foram perdidas. O percurso recomeçará desde o início.','ENTER ou ESPAÇO: recomeçar');requestAnimationFrame(draw)}
function next(){stage++;selected=-1;toast='';toastTime=0;hangErrors=0;guessed.clear();mask=['C','I','_','N','T','I','F','I','C','I','S','M','O'];if(stage>=4)state='win';else{state='walk';px=120;cam=0}}
function lose(){lives--;beep(120,.2,'sawtooth',.05);if(lives<=0)state='lose'}
function answer(i){selected=i;if(i===qs[stage].a){toast='CORRETO!';toastTime=35;beep(660,.1);beep(880,.13);setTimeout(next,650)}else{toast='INCORRETO — você perdeu uma vida.';toastTime=55;lose();if(state!=='lose')setTimeout(()=>{selected=-1;toast='';toastTime=0},700)}}
function start(){audioInit();state='walk';stage=0;lives=3;px=120;cam=0;beep(440,.1);beep(660,.12)}
function reset(){state='title';stage=0;lives=3;px=120;cam=0;selected=-1;hangErrors=0;guessed.clear();mask=['C','I','_','N','T','I','F','I','C','I','S','M','O']}
function hangKey(k){let L=k.toUpperCase();if(guessed.has(L))return;guessed.add(L);if(word.includes(L)){for(let i=0;i<word.length;i++)if(word[i]===L)mask[i]=L;beep(520,.07);if(!mask.includes('_'))setTimeout(()=>{toast='CORRETO!';toastTime=30;beep(660,.1);setTimeout(next,500)},200)}else{hangErrors++;beep(140,.14,'sawtooth',.04);if(hangErrors>=3){lose();hangErrors=0;guessed.clear();mask=['C','I','_','N','T','I','F','I','C','I','S','M','O']}}}
window.addEventListener('keydown',e=>{audioInit();if(e.key.toLowerCase()==='m'){document.getElementById('sound').click();return}if(state==='title'&&(e.key==='Enter'||e.key===' ')){start();return}if((state==='win'||state==='lose')&&(e.key==='Enter'||e.key===' ')){reset();return}if(state==='walk'){if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')px=Math.min(1820,px+7);if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')px=Math.max(80,px-7);if((e.key==='Enter'||e.key===' ')&&px>1710){state=stage===2?'hang':'question';beep(520,.08)}return}if(state==='question'&&['1','2','3','4'].includes(e.key))answer(+e.key-1);else if(state==='hang'){if(e.key==='Enter'){if(!mask.includes('_')&&mask.join('')===word){next()}return}if(/^[a-zA-Z]$/.test(e.key))hangKey(e.key)}});
c.addEventListener('pointerdown',()=>{audioInit();if(state==='title')start()});
function moveCam(){if(state==='walk'){if(px>cam+620)cam=Math.min(1090,cam+8);if(px<cam+280)cam=Math.max(0,cam-8)}requestAnimationFrame(moveCam)}moveCam();draw();
</script></body></html>
